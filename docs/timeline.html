<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial PoC IMG</title>
<style>
  :root{
    --bg:#fafafa; --fg:#1b1f23; --muted:#6a737d; --line:#e1e4e8;
    --done:#1a7f4b; --doing:#b7791f; --todo:#9aa3ab; --accent:#0b6e7a;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#111418; --fg:#e6e9ec; --muted:#8b949e; --line:#262c33;
    --done:#4cc38a; --doing:#e3b341; --todo:#6b747d; --accent:#55c3d0;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:32px 16px 64px}
  main{max-width:720px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);margin:0 0 20px}
  .summary{display:flex;gap:20px;flex-wrap:wrap;padding:12px 0;margin-bottom:8px;border-block:1px solid var(--line);
           font:13px ui-monospace,Consolas,monospace;color:var(--muted)}
  .summary b{color:var(--fg);font-weight:600}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px;font-weight:600}
  ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  li{position:relative;padding:0 0 18px 20px}
  li::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;
             background:var(--todo);outline:3px solid var(--bg)}
  li.done::before{background:var(--done)}
  li.doing::before{background:var(--doing)}
  .date{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
  .title{font-weight:600}
  .detail{color:var(--muted);margin:2px 0 0}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font:12px ui-monospace,Consolas,monospace}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tag{color:var(--muted)}
  .empty{color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){li{transition:opacity .2s}}
</style>
</head>
<body>
<main>
  <h1>Historial PoC IMG en Fabric</h1>
  <p class="sub">Avances del proyecto, del más reciente al más antiguo. Repositorio: <a id="repo" href="#" target="_blank" rel="noopener"></a></p>
  <div class="summary" id="summary"></div>

  <h2>Próximo</h2>
  <ol id="next_up"></ol>

  <h2>Avances</h2>
  <ol id="progress"></ol>
</main>

<script>
/* Para registrar un avance: agregar un objeto al inicio de EVENTS (los más recientes primero).
   status: "done" | "doing" | "pending"   ·   commit: SHA corto opcional   ·   pr: número opcional   ·   link: URL opcional */
const REPO = "https://github.com/plazasgiovanny/img-poc-fabric";

const EVENTS = [
  { date:"2026-10-06", status:"done", title:"pl_img_cycle ejecutado completo en Fabric con 4 aprobaciones",
    detail:"Ciclo 2026-10g: 1.905 s (≈31,8 min) de punta a punta; 18 de 26 actividades ejecutadas (las 8 de rechazo/fallo no se activaron). Los 27 cuadernos están importados y ejecutados. Ciclos medidos con nb_measure: 2026-10a, 10b, 10c, 10g y 10k (10x, 2.033 s ≈ 33,9 min); cadena de cuadernos de 291 a 356 s. Embudo del corte 1: 548 → 507 → 488 → 166 elegibles → 66 titulares (7.920.000); errores 0 % contra la verdad conocida. G2 a G5 y G7 cerrados, G6 parcial, G9 cerrado.", link:"../pipelines/README.md" },
  { date:"2026-10-03", status:"done", title:"PR #7 mergeado: G10 cerrado en la documentación",
    detail:"Resultados de las tres corridas de la aprobación y criterio para registrar al aprobador (aprobador designado y hora con utcNow()).", pr:7, commit:"a2bda0c" },
  { date:"2026-10-03", status:"done", title:"PR #6 mergeado: inventario de pipelines",
    detail:"Plantilla JSON de pl_env_check_approval sin IDs de entorno y scripts/pipeline_tool.py (render y templatize); un test impide que las plantillas filtren GUIDs o correos.", pr:6, commit:"532cbea", link:"../pipelines/INVENTORY.md" },
  { date:"2026-10-03", status:"done", title:"G10 cerrado: la aprobación humana funciona (plan A)",
    detail:"Aprobada, rechazada y vencida probadas en Fabric y distinguibles por el mensaje; la plantilla JSON se importó sin cambios. La salida no trae quién aprobó: se registra el aprobador designado. La actividad está en vista previa; el plan B queda de respaldo.", link:"../pipelines/INVENTORY.md" },
  { date:"2026-10-03", status:"done", title:"Verificación del entorno: 13 de 13 pruebas OK en Fabric",
    detail:"nb_env_check pasó completo en el trial: nombres de tabla de tres partes, auditoría con userMetadata, time travel, runMultiple con dependencias y notebookutils.fs. Corrobora el arreglo de la bitácora (PR #5)." },
  { date:"2026-10-03", status:"done", title:"Prueba de la aprobación humana (G10) e inventario de pipelines",
    detail:"La actividad Approval existe, espera la decisión y un rechazo la hace fallar con un mensaje legible. Los pipelines se versionan ahora como plantillas JSON sin IDs de entorno.", link:"../pipelines/INVENTORY.md" },
  { date:"2026-10-03", status:"done", title:"PR #3 y #4 mergeados tras revisión independiente",
    detail:"Tres revisores en paralelo (equivalencia de comportamiento, consistencia de cuadernos/DDL, integridad de docs y HTML) dieron OK con observaciones; las referencias desactualizadas se corrigieron antes del merge.", pr:4, commit:"edac5ea" },
  { date:"2026-10-03", status:"done", title:"PR #5 mergeado: arreglo de la bitácora (run_log.record)",
    detail:"Los revisores señalaron que record() creaba el DataFrame sin esquema y podía fallar en la primera ejecución en Fabric. Se corrigió con pruebas con Spark simulado y la prueba 6 de nb_env_check lo confirmó en Fabric.", pr:5, commit:"505dcc9" },
  { date:"2026-10-03", status:"done", title:"Código, archivos y datos en inglés",
    detail:"Barrido de todo el repo: archivos, módulos, funciones, variables, tablas, columnas y valores en inglés; solo comentarios y documentación siguen en español. Glosario con la correspondencia al documento en docs/NAMING.md.", link:"NAMING.md" },
  { date:"2026-10-03", status:"done", title:"PR #1 mergeado a main",
    detail:"Etapas 2 y 3, controles, métricas, DAG, cuadernos, diagramas y explicación visual ya están en main.", commit:"55e3ef9", pr:1 },
  { date:"2026-10-03", status:"done", title:"Verificación del entorno preparada",
    detail:"Cuaderno que verifica 12 supuestos en Fabric, paquete listo para subir (wheel, DDL, datos sintéticos, cuadernos con la versión de git) y paso a paso con la prueba de aprobación." },
  { date:"2026-10-03", status:"done", title:"Explicación visual de los cambios del PR #1",
    detail:"HTML interactivo con el ciclo paso a paso (qué, por qué, para qué y aporte), tres diagramas editables en draw.io, un simulador de la regla de publicación y una guía de revisión.", link:"pr1_changes.html" },
  { date:"2026-10-03", status:"done", title:"Repositorio público y PR #1 abiertos",
    detail:"Repo creado con gh; main y feature/etapas-2-3 publicadas. El PR queda para revisión del equipo.", pr:1 },
  { date:"2026-10-03", status:"done", title:"Historial de avances",
    detail:"Este archivo (docs/timeline.html), sin dependencias; se actualiza con cada avance." },
  { date:"2026-10-02", status:"done", title:"Etapas 2 y 3, controles, métricas, DAG y cuadernos",
    detail:"Cruces, liquidación mínima, 4 controles, orquestadores runMultiple y guía del pipeline. 22 pruebas en verde; error <1 % a 500 y 5.000 registros sintéticos. Sin ejecutar en Fabric.", commit:"c4d81da" },
  { date:"2026-10-02", status:"done", title:"Estructura inicial y Etapa 1",
    detail:"img_lib, generador sintético con verdad conocida, DDL de control y parámetros ilustrativos, cuadernos de Bronce, Plata, MDM y Oro, CI.", commit:"ae18b61" },
  { date:"2026-10-02", status:"done", title:"Propuesta de la PoC publicada",
    detail:"Alcance, arquitectura, cronograma de 7 días, riesgos y pendientes para el equipo.", link:"https://claude.ai/artifact/Bi81eogZdjonv6j8WDsLvv" },
  { date:"2026-10-02", status:"done", title:"Plan aprobado",
    detail:"Datos sintéticos, 2 fuentes, MDM, publicación en OneLake, plazo de 1 semana y demo con métricas del Experimento 2. Trial, aprobación humana, runMultiple y Environments verificados en la documentación de Microsoft." },
  { date:"2026-10-02", status:"done", title:"Documento v2 analizado",
    detail:"13 fuentes, 4 controles, Tablas 7 a 9. «MBM» no aparece en el documento: se interpretó como MDM." },
];

const NEXT_UP = [
  { status:"doing", title:"G6: umbrales del MDM", detail:"G2 a G5 y G7 están cerrados con la información de Jhon; G6 sigue parcial (identidad por tipo y número; umbrales de coincidencia aproximada sin definir)." },
  { status:"pending", title:"Línea base manual (G1)", detail:"Se usa la estimación propia del equipo (≈120 h/ciclo), declarada como tal; sin línea base medida no se puede afirmar la reducción de tiempo ≥30 %." },
  { status:"pending", title:"G8 y G11", detail:"Plazo y canal de cada control; costo operativo por ciclo (Tabla 4)." },
  { status:"pending", title:"Experimento 1", detail:"No ejecutado. La corrida a 10x (ciclo 2026-10k, ≈5.000 personas, ≈33,9 min) sí se ejecutó." },
  { status:"pending", title:"Automatizar la importación al portal (issue #8)", detail:"La fase 3 (cuadernos .ipynb) está cubierta con notebook_tool.py y pipeline_tool.py cubre render, templatize e ids-from-text; sigue manual la importación y falta un script de despliegue por API." },
  { status:"pending", title:"Corregir requested_at en nb_record_approval", detail:"Copiar el requested_at de la fila PENDING a la fila APPROVED; ver lecciones en pipelines/README.md.", link:"../pipelines/README.md" },
  { status:"pending", title:"Vencimiento del trial de Fabric", detail:"Vence ≈8 de diciembre de 2026 («Queda 64 días» el 5 de octubre)." },
  { status:"pending", title:"Actualizar el documento v2", detail:"§7, §13, §15, §16, §18, §19, §23, Tabla 4, Anexo A y ética. El .docx lo edita el equipo; aquí solo se redacta el borrador." },
];

const LABELS = { done:"hecho", doing:"en curso", pending:"pendiente" };
const fmt = f => new Date(f + "T00:00:00").toLocaleDateString("es-CO", { day:"numeric", month:"short", year:"numeric" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function item(e){
  const links = [];
  if (e.commit) links.push(`<a href="${REPO}/commit/${esc(e.commit)}" target="_blank" rel="noopener">commit ${esc(e.commit)}</a>`);
  if (e.pr) links.push(`<a href="${REPO}/pull/${e.pr}" target="_blank" rel="noopener">PR #${e.pr}</a>`);
  if (e.link) links.push(`<a href="${esc(e.link)}" target="_blank" rel="noopener">enlace</a>`);
  return `<li class="${e.status}">
    <div class="date">${e.date ? fmt(e.date) + " · " : ""}<span class="tag">${LABELS[e.status]}</span></div>
    <div class="title">${esc(e.title)}</div>
    <p class="detail">${esc(e.detail || "")}</p>
    ${links.length ? `<div class="meta">${links.join("")}</div>` : ""}
  </li>`;
}

const repo = document.getElementById("repo");
repo.href = REPO; repo.textContent = REPO.replace("https://github.com/", "");
document.getElementById("progress").innerHTML = EVENTS.map(item).join("");
document.getElementById("next_up").innerHTML = NEXT_UP.map(item).join("");

const count = e => EVENTS.filter(x => x.status === e).length;
document.getElementById("summary").innerHTML =
  `<span><b>${count("done")}</b> avances</span>` +
  `<span><b>${NEXT_UP.filter(x => x.status === "doing").length}</b> en curso</span>` +
  `<span><b>${NEXT_UP.filter(x => x.status === "pending").length}</b> pendientes</span>` +
  `<span>último: <b>${fmt(EVENTS[0].date)}</b></span>`;
</script>
</body>
</html>
